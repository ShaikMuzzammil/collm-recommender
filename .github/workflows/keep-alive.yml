name: 🔔 Keep CoLLM Awake

on:
  schedule:
    # Every 10 minutes — well within GitHub Actions free quota (2,000 min/month)
    - cron: '*/10 * * * *'
  workflow_dispatch:
    inputs:
      verbose:
        description: 'Print response bodies'
        required: false
        default: 'false'

jobs:
  ping:
    name: Ping Services
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Ping backend /ping  (fast warm-up)
        id: ping
        run: |
          echo "🔔 $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            https://collm-backend.onrender.com/ping || echo "000")
          echo "ping_status=$STATUS" >> $GITHUB_OUTPUT
          echo "Backend /ping → $STATUS"

      - name: Ping backend /health
        id: health
        run: |
          BODY=$(curl -sf --max-time 20 \
            https://collm-backend.onrender.com/health || echo '{"error":"timeout"}')
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 20 \
            https://collm-backend.onrender.com/health || echo "000")
          echo "health_status=$STATUS" >> $GITHUB_OUTPUT
          echo "Backend /health → $STATUS  |  $BODY"

      - name: Ping backend /wake  (full model check)
        id: wake
        run: |
          BODY=$(curl -sf --max-time 25 \
            https://collm-backend.onrender.com/wake || echo '{"error":"timeout"}')
          echo "Backend /wake → $BODY"

      - name: Ping frontend
        id: frontend
        run: |
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            https://collm-frontend.onrender.com || echo "000")
          echo "frontend_status=$STATUS" >> $GITHUB_OUTPUT
          echo "Frontend → $STATUS"

      - name: Summary
        if: always()
        run: |
          B="${{ steps.health.outputs.health_status }}"
          F="${{ steps.frontend.outputs.frontend_status }}"
          echo "## 🔔 CoLLM Keep-Alive — $(date -u '+%Y-%m-%d %H:%M UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|--------|" >> $GITHUB_STEP_SUMMARY
          if [ "$B" = "200" ]; then
            echo "| Backend  | $B | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Backend  | $B | ⚠️ Check logs |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "$F" = "200" ]; then
            echo "| Frontend | $F | ✅ Healthy |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Frontend | $F | ⚠️ Check logs |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Next ping in ~10 minutes_" >> $GITHUB_STEP_SUMMARY
